name: Linux tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Desktop launcher test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-glib-2.0 libsdl2-2.0-0 libsdl2-ttf-2.0-0 fonts-dejavu-core xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        env:
          PYTHONPATH: app
          SDS_REQUIRE_UI_TESTS: '1'
          SDS_UI_PROOF: ${{ matrix.python == '3.12' && '1' || '0' }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python -m unittest discover -s tests -v
      - name: Build and inspect clean release
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: Switch-Deck-Sync-preview
          path: dist/*
