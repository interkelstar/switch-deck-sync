name: Build prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -v
      - name: Check tag and build release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,pathlib; assert os.environ["RELEASE_TAG"] == "v" + pathlib.Path("VERSION").read_text().strip()'
          python scripts/build_release.py
      - name: Publish prerelease artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "Switch Deck Sync $RELEASE_TAG" --generate-notes
